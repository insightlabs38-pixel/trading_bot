name: CPU CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpu-ci-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Capture Python 3.12 CPU training lock
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth_header" \
            fetch --no-tags --depth=1 origin "refs/heads/${HEAD_REF}"
          git checkout -B "$HEAD_REF" FETCH_HEAD

      - name: Verify system Python 3.12
        run: |
          python3.12 --version
          python3.12 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Bootstrap pinned uv CLI
        run: |
          python3.12 -m venv /tmp/trading-bot-uv
          /tmp/trading-bot-uv/bin/python -m pip install --disable-pip-version-check "uv>=0.10,<0.11"
          echo "/tmp/trading-bot-uv/bin" >> "$GITHUB_PATH"

      - name: Resolve and commit lockfile only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Lock Phase 5 CPU training dependencies"
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:refs/heads/${HEAD_REF}"
