name: CPU CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpu-ci-phase8-typefix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typefix:
    name: Apply Phase 8 typing fix
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR head branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth_header" \
            fetch --no-tags --depth=1 origin "refs/heads/${HEAD_REF}"
          git checkout -B "$HEAD_REF" FETCH_HEAD

      - name: Apply strict typing boundary fix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/trading_bot/models/advanced.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "from typing import Literal\n": "from typing import Literal, cast\n",
              "        return self.norm(sequence + encoded)\n":
              "        return cast(Tensor, self.norm(sequence + encoded))\n",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f"expected exactly one occurrence: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trading_bot/models/advanced.py
          git commit -m "Fix Phase 8 strict PyTorch typing boundary"
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:refs/heads/${HEAD_REF}"
