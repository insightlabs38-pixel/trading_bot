name: CPU CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpu-ci-phase7-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Apply Phase 7 Ruff formatting
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR head branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth_header" \
            fetch --no-tags --depth=1 origin "refs/heads/${HEAD_REF}"
          git checkout -B "$HEAD_REF" FETCH_HEAD

      - name: Verify Python 3.12 and bootstrap uv
        run: |
          python3.12 --version
          python3.12 -m venv /tmp/trading-bot-uv
          /tmp/trading-bot-uv/bin/python -m pip install --disable-pip-version-check "uv>=0.10,<0.11"
          echo "/tmp/trading-bot-uv/bin" >> "$GITHUB_PATH"

      - name: Sync locked baseline environment
        run: uv sync --locked --group baseline-cpu

      - name: Format and commit only reported Phase 7 files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          uv run ruff format \
            src/trading_bot/models/baseline_checkpoint.py \
            src/trading_bot/models/baseline_classical.py \
            src/trading_bot/models/baseline_objectives.py \
            tests/models/test_phase7_baselines.py
          uv run ruff check \
            src/trading_bot/models/baseline_checkpoint.py \
            src/trading_bot/models/baseline_classical.py \
            src/trading_bot/models/baseline_objectives.py \
            tests/models/test_phase7_baselines.py
          git add \
            src/trading_bot/models/baseline_checkpoint.py \
            src/trading_bot/models/baseline_classical.py \
            src/trading_bot/models/baseline_objectives.py \
            tests/models/test_phase7_baselines.py
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format Phase 7 baseline implementation"
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:refs/heads/${HEAD_REF}"
