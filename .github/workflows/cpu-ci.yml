name: Phase 6 Reconciliation Helper

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase6-reconcile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile Phase 6 tracker and progress
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out target Phase 6 branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: phase6-cpu-evaluator
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth_header" \
            fetch --no-tags --depth=1 origin "refs/heads/${TARGET_REF}"
          git checkout -B "$TARGET_REF" FETCH_HEAD

      - name: Reconcile tracker and detailed progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: phase6-cpu-evaluator
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plan = Path("IMPLEMENTATION_PLAN.md")
          text = plan.read_text(encoding="utf-8")

          old_reconciliation = """The Phase 0–4 tracker is reconciled below against the current foundation-hardening branch and its supported-runtime CI evidence. Phase 1 is complete; Phase 2 is blocked only on real S3/provider validation; the provider-independent Phase 3/4 CPU implementation is substantially complete, including production exchange-calendar support and the Parquet + Zstd research representation. Remaining Phase 3/4 production gates require external provider choices/data, frozen production methodology/dates, finalized production-dataset validation, or H200 benchmarking."""
          new_reconciliation = """The Phase 0–6 tracker is reconciled below against supported-runtime CI evidence. Phase 1 is complete; Phase 2 is blocked only on real S3/provider validation; the provider-independent Phase 3/4 CPU implementation is substantially complete; the Phase 5 CPU training-framework gate has passed while GPU acceptance remains open; and the Phase 6 CPU/reference evaluator gate has passed while real factor/BBO dataset validation remains external. Remaining open items across Phases 2–6 require external provider/data choices, frozen production methodology/dates, finalized production-data validation, or GPU/H200 acceptance."""
          if text.count(old_reconciliation) != 1:
              raise RuntimeError("expected one Phase 0-4 reconciliation paragraph")
          text = text.replace(old_reconciliation, new_reconciliation, 1)

          old_status = "| 6. Evaluation/backtesting framework | Not started | Yes |"
          new_status = "| 6. Evaluation/backtesting framework | **IN PROGRESS — CPU gate passed; real factor/BBO data acceptance pending** | Yes |"
          if text.count(old_status) != 1:
              raise RuntimeError("expected one Phase 6 master-status row")
          text = text.replace(old_status, new_status, 1)

          old_block = """# 8. Phase 6 — canonical evaluator and backtester

## Goal

Implement the frozen evaluation contract once and make every model use it.

## Return accounting

- [ ] Gross portfolio return.
- [ ] Position changes/turnover.
- [ ] Fees.
- [ ] Spread cost.
- [ ] Slippage.
- [ ] Market-impact approximation.
- [ ] Canonical net return/NAV series.

## Predictive metrics

- [ ] Mean Rank IC.
- [ ] Median Rank IC.
- [ ] IC standard deviation.
- [ ] ICIR.
- [ ] Fraction of positive IC periods.
- [ ] IC by fold/regime/horizon.

## Economic metrics

- [ ] Net Sharpe.
- [ ] CAGR.
- [ ] Sortino.
- [ ] Maximum drawdown.
- [ ] Drawdown duration.
- [ ] Calmar.
- [ ] ES95.
- [ ] Worst day.

## Trading-friction metrics

- [ ] Turnover.
- [ ] Total modeled cost.
- [ ] Break-even transaction cost.
- [ ] Trade/rebalance count.
- [ ] Cost stress at multiple multipliers.
- [ ] Spread stress.
- [ ] Latency/execution-delay stress for finalists.

## Robustness

- [ ] Fold-level statistics.
- [ ] Seed dispersion.
- [ ] Positive-fold fraction.
- [ ] Deflated Sharpe Ratio.
- [ ] Probability of Backtest Overfitting or equivalent implementation matching frozen contract.
- [ ] Multiple-testing trial count accounting.

## Attribution

- [ ] Market beta.
- [ ] Common factor exposures.
- [ ] Residual/alpha diagnostics.

## Execution-oriented finalist metrics

- [ ] Implementation-shortfall calculation.
- [ ] Participation/liquidity diagnostics.
- [ ] BBO/L1 execution simulator when execution dataset is available.
- [ ] Market/limit-order abstraction sufficient for medium-frequency tests.

## Leaderboard behavior

- [ ] Hard validity/disqualification gates.
- [ ] Primary predictive/economic ranking hierarchy.
- [ ] No opaque single score as sole selection criterion.
- [ ] Export machine-readable and human-readable reports.

## Tests

- [ ] Hand-calculated metric fixtures.
- [ ] Zero-return strategy.
- [ ] Buy-and-hold fixture.
- [ ] Known-cost fixture.
- [ ] Drawdown fixture.
- [ ] No-lookahead execution timing fixture.

## Gate

Given saved predictions, the evaluator can reproduce the complete leaderboard and all core metrics without importing the training code.
"""
          new_block = """# 8. Phase 6 — canonical evaluator and backtester

## Goal

Implement the frozen evaluation contract once and make every model use it.

## Return accounting

- [x] Gross portfolio return.
- [x] Position changes/turnover.
